<script src="assets/js/main.js"></script><script src="assets/js/api.js"></script><script>
function toggleNav(){const l=document.getElementById('navLinks');l.classList.toggle('open');document.querySelector('.hamburger').setAttribute('aria-expanded',l.classList.contains('open'))}
let map;
const params = new URLSearchParams(window.location.search);
const currentRequestId = params.get('id') || '';
let currentRating = 5;

function initMap(req){
  if(!req||req.latitude===null||req.longitude===null||!window.L)return;
  map=L.map('map').setView([Number(req.latitude),Number(req.longitude)],13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OSM'}).addTo(map);
  L.marker([Number(req.latitude),Number(req.longitude)]).addTo(map).bindPopup('Emergency location');
}

function updateTimeline(status) {
  const steps = [
    { key: 'requested', label: 'Requested' },
    { key: 'accepted', label: 'Accepted' },
    { key: 'on_the_way', label: 'On the way' },
    { key: 'arrived', label: 'Arrived' },
    { key: 'completed', label: 'Completed' }
  ];
  const order = ['requested', 'accepted', 'on_the_way', 'arrived', 'completed'];
  const curIdx = order.indexOf(status);
  const cont = document.getElementById('timeline');
  cont.innerHTML = '';

  steps.forEach((s, idx) => {
    const isDone = idx <= curIdx;
    const isActive = idx === curIdx;
    const d = document.createElement('div');
    d.className = 'status-step ' + (isDone ? 'completed' : '') + (isActive ? ' active' : '');
    d.textContent = s.label;
    cont.appendChild(d);
  });

  if (status === 'completed') {
    document.getElementById('ratingSection').style.display = 'block';
  }
}

document.addEventListener('DOMContentLoaded', () => {
  if (!currentRequestId) { document.getElementById('trackingDetails').textContent='Open tracking from your patient dashboard to view a case.'; return; }
  updateTimeline('requested');

  // Initial fetch
  api.get_request_status({ id: currentRequestId }).then(r => {
    if (r.success && r.data.request) {
      const req=r.data.request;
      initMap(req);
      updateTimeline(req.status);
      document.getElementById('trackingTitle').textContent='Case Tracking — '+(req.type||'Emergency');
      document.getElementById('trackingDetails').textContent='Status: '+String(req.status||'requested').replaceAll('_',' ')+'. Location sharing is not live tracking.';
      document.getElementById('volunteerInfo').textContent=req.volunteerName?'Assigned volunteer: '+req.volunteerName:'No volunteer has accepted this request yet.';
    }
  });

  // Subscribe to real-time Server-Sent Events (SSE)
  if (window.EventSource) {
    api.subscribeStream(currentRequestId, {
      onRequestUpdate: (req) => {
        if (req.status) {
          updateTimeline(req.status);
          showToast('Status updated: ' + req.status, 'info');
        }
      }
    });
  }
});

function pickStar(n){
  currentRating = n;
  document.querySelectorAll('[aria-label*="star"]').forEach((b,i)=>b.textContent=i<n?'★':'☆');
}

function submitRating(e){
  e.preventDefault();
  api.submit_rating({
    request_id: currentRequestId,
    stars: currentRating,
    comment: ''
  }).then(r => {
    if (r.success) {
      showToast('Thanks for your rating!', 'success');
      document.getElementById('ratingSection').innerHTML = '<p style="color:#2a7a2a;font-weight:600;">✓ Rating submitted. Thank you!</p><a href="case-report.html?id=' + encodeURIComponent(currentRequestId) + '" target="_blank" rel="noopener" class="btn btn-outline" style="margin-top:10px;display:inline-block;">📄 View / Print Case Report</a>';
    } else {
      showToast(r.error || 'Rating failed', 'error');
    }
  });
}
</script><script src="assets/js/auth-guard.js"></script></body></html>
