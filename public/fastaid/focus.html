  <div class="focus-header"><h2>Focus Mode</h2><p id="focusCase">Assigned case</p></div>

  <div class="modal-overlay" id="debriefModal"><div class="modal debrief-modal"><button onclick="closeModal('debriefModal')" aria-label="Close" style="float:right;background:none;border:none;font-size:1.2rem;cursor:pointer;">×</button><div class="card-icon">&#9670;</div><h3>Post Case Debrief (60s)</h3><form onsubmit="submitDebrief(event)"><p>What worked?</p><textarea id="d1" placeholder="Short note..." required></textarea><p>What was hard?</p><textarea id="d2" placeholder="Short note..." required></textarea><p>What would you change?</p><textarea id="d3" placeholder="Short note..." required></textarea><p id="countdown">60</p><button type="submit" class="btn btn-red" style="width:100%;">Submit</button></form></div></div>

  <script src="assets/js/main.js"></script><script src="assets/js/api.js"></script>
  <script>
    let sec=0,tInterval;
    function startTimer(){tInterval=setInterval(()=>{sec++;const m=Math.floor(sec/60).toString().padStart(2,'0');const s=(sec%60).toString().padStart(2,'0');document.getElementById('timer').textContent=m+':'+s;},1000);}
    document.addEventListener('DOMContentLoaded',()=>{startTimer();});
    const focusRequestId=new URLSearchParams(window.location.search).get('id');
    function markArrived(){if(!focusRequestId)return showToast('No case selected','error');if(focusStatus==='arrived')return showToast('Arrival is already marked');if(focusStatus!=='accepted'&&focusStatus!=='on_the_way')return showToast('This case cannot be marked arrived in its current status','error');const transition=focusStatus==='accepted'?api.update_request_status({id:focusRequestId,status:'on_the_way'}):Promise.resolve({success:true});transition.then(r=>{if(!r.success)return showToast(r.error||'Could not update status','error');api.update_request_status({id:focusRequestId,status:'arrived'}).then(a=>{if(a.success){focusStatus='arrived';showToast('Arrival marked');}else showToast(a.error||'Could not update status','error');}).catch(()=>showToast('Could not update status','error'));}).catch(()=>showToast('Could not update status','error'));}
    let focusStatus='accepted';
    function completeCase(){if(!focusRequestId||focusStatus!=='arrived')return showToast('Mark arrival before completing this case','error');api.update_request_status({id:focusRequestId,status:'completed'}).then(r=>{if(!r.success)return showToast(r.error||'Could not complete case','error');focusStatus='completed';clearInterval(tInterval);showToast('Case completed');openModal('debriefModal');startCountdown();});}
    function startCountdown(){let c=60;const el=document.getElementById('countdown');const iv=setInterval(()=>{c--;if(el)el.textContent=c;if(c<=0){clearInterval(iv);}},1000);}
    function submitDebrief(e){e.preventDefault();api.submit_debrief({request_id:focusRequestId,answers:[document.getElementById('d1').value,document.getElementById('d2').value,document.getElementById('d3').value]}).then(r=>{if(r.success){showToast('Debrief submitted');closeModal('debriefModal');}else showToast(r.error||'Debrief failed','error');});}
    const focusSteps=document.getElementById('focusInstructions');
    function showInstructions(type){const bleeding=String(type||'').toLowerCase().includes('bleeding');const steps=bleeding?['Apply firm direct pressure with a clean cloth.','Keep the wound elevated if possible.','Do not remove soaked cloth; layer more on top.','Call your local emergency number for severe bleeding.']:['Call your local emergency number for life-threatening emergencies.','Follow instructions from the emergency dispatcher.','Stay with the person and share relevant changes with responders.'];steps.forEach(text=>{const li=document.createElement('li');li.textContent=text;focusSteps.appendChild(li);});}
    if(!focusRequestId){document.getElementById('focusCase').textContent='No case selected';document.getElementById('focusEmergency').textContent='Open Focus Mode from an accepted request.';document.querySelectorAll('button[onclick="markArrived()"],button[onclick="completeCase()"]').forEach(button=>button.disabled=true);}
    else api.get_request_status({id:focusRequestId}).then(r=>{if(!r.success||!r.data.request){showToast(r.error||'Could not load case','error');return;}const req=r.data.request;focusStatus=req.status;document.getElementById('focusCase').textContent='Case '+req.id+' — '+req.type+' ('+focusStatus.replaceAll('_',' ')+')';document.getElementById('focusEmergency').textContent='Patient emergency: '+req.type;showInstructions(req.type);if(req.latitude!==null&&req.longitude!==null&&window.L){const map=L.map('map').setView([Number(req.latitude),Number(req.longitude)],15);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OSM'}).addTo(map);L.marker([Number(req.latitude),Number(req.longitude)]).addTo(map).bindPopup('Emergency location');}}).catch(()=>showToast('Could not load case','error'));
  </script>
