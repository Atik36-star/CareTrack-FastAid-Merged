<script>
function toggleNav(){const l=document.getElementById('navLinks');l.classList.toggle('open');document.querySelector('.hamburger').setAttribute('aria-expanded',l.classList.contains('open'))}
function logoutUser(e){e.preventDefault();api.logout().then(r=>{if(r.success)window.location='login.html';else showToast(r.error||'Logout failed.','error');});}
api.get_notifications().then(r=>{if(r.success){const list=document.getElementById('notifList');(r.data.notifications||[]).forEach(n=>{const li=document.createElement('li');li.style.padding='10px 0';li.style.borderBottom='1px solid #f0eeec';const title=document.createElement('strong');title.textContent=n.title||'Update';const message=document.createElement('span');message.textContent=' — '+(n.message||'');li.append(title,message);list.appendChild(li);});}});
api.get_me().then(r=>{if(r.success)document.getElementById('patientWelcome').innerHTML='Welcome, '+escapeHtml(r.data.user.name||'');});
api.get_my_requests().then(r=>{if(!r.success)return;const active=document.getElementById('activeRequestCards'),past=document.getElementById('pastRequests');(r.data.requests||[]).forEach(req=>{const card=document.createElement('article');card.className='card';const title=document.createElement('h4');title.textContent=(req.emergency_type||'Emergency')+' — '+(req.status||'requested').replaceAll('_',' ');const detail=document.createElement('p');detail.textContent=req.description||'No additional description.';const link=document.createElement('a');link.className='btn btn-red';link.style.marginTop='16px';link.style.display='inline-block';link.href='tracking.html?id='+encodeURIComponent(req.id);link.textContent='Track Case';card.append(title,detail,link);if(req.status==='completed'){const report=document.createElement('a');report.className='btn btn-outline';report.style.margin='16px 0 0 8px';report.style.display='inline-block';report.href='case-report.html?id='+encodeURIComponent(req.id);report.textContent='View Report';card.appendChild(report);}(req.status==='completed'||req.status==='cancelled'?past:active).appendChild(card);});if(!active.children.length)active.textContent='No active request.';if(!past.children.length)past.textContent='No past requests.';});
</script><script src="assets/js/auth-guard.js"></script></body></html>
